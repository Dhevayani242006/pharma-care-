<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaCare - Authentication (Admin & Customer)</title>
  
  <!-- Google Fonts (Serif + Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">
      
      <div class="login-header">
        <a href="../index.html" class="back-home-link" title="Return to Homepage">
          <i class="fa-solid fa-arrow-left"></i> Home
        </a>
        <div class="brand-logo">
          <img src="../images/logo.png" alt="PharmaCare Logo">
          <h2>PharmaCare</h2>
        </div>
        <p class="login-subtitle">Sign in to access your pharmacy portal</p>
      </div>

      <!-- Role Tabs Selection -->
      <div class="auth-tabs">
        <button type="button" id="tabAdmin" class="tab-btn active" onclick="switchTab('admin')">
          <i class="fa-solid fa-user-shield"></i> Admin Login
        </button>
        <button type="button" id="tabCustomer" class="tab-btn" onclick="switchTab('customer')">
          <i class="fa-solid fa-user-check"></i> Customer Sign In
        </button>
      </div>

      <!-- Demo Credentials Quick Fill Banner -->
      <div class="demo-card" id="demoBanner">
        <div class="demo-header">
          <i class="fa-solid fa-key" style="color: #f59e0b;"></i>
          <span><strong>Demo Credentials</strong></span>
        </div>
        <div class="demo-details" id="demoAdminInfo">
          <p>Username: <code>admin</code> | Password: <code>admin123</code></p>
          <button type="button" class="btn-demo-fill" onclick="fillDemo('admin')">
            <i class="fa-solid fa-bolt"></i> Quick Fill Admin Demo
          </button>
        </div>
        <div class="demo-details" id="demoCustomerInfo" style="display:none;">
          <p>Username: <code>customer</code> | Password: <code>customer123</code></p>
          <button type="button" class="btn-demo-fill" onclick="fillDemo('customer')">
            <i class="fa-solid fa-bolt"></i> Quick Fill Customer Demo
          </button>
        </div>
      </div>

      <!-- Authentication Form -->
      <form id="loginForm">
        <input type="hidden" id="loginRole" value="admin">
        
        <div class="form-group">
          <label for="username"><i class="fa-solid fa-user"></i> Username / Email</label>
          <input type="text" id="username" placeholder="Enter username or email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Toggle password visibility">
              <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submitLoginBtn" class="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In as Admin
        </button>
      </form>

      <div class="login-footer">
        <p>© 2026 PharmaCare System. All rights reserved.</p>
      </div>

    </div>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
